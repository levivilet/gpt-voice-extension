<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Realtime Voice Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(circle at 50% 30%, #1b1f2e, #0a0c14 70%);
        color: #eef0f6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
      }

      #stage {
        width: 260px;
        height: 260px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #bubble {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #8ea8ff,
          #4a5bd6 55%,
          #2a2f7a 100%
        );
        box-shadow: 0 0 40px rgba(120, 140, 255, 0.45);
        transform: scale(1);
        transition:
          transform 60ms linear,
          box-shadow 120ms linear;
        will-change: transform;
      }

      #bubble.listening {
        background: radial-gradient(
          circle at 35% 30%,
          #9dffcf,
          #33c98a 55%,
          #1a5e42 100%
        );
        box-shadow: 0 0 40px rgba(90, 255, 180, 0.45);
      }

      #status {
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9aa0b4;
      }

      button {
        padding: 12px 28px;
        font-size: 15px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        background: #4a5bd6;
        color: white;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.stop {
        background: #c94a4a;
      }

      #transcript {
        width: min(560px, 90vw);
        min-height: 160px;
        max-height: 40vh;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 16px 18px;
        font-size: 15px;
        line-height: 1.5;
      }
      #transcript .line {
        margin-bottom: 10px;
      }
      #transcript .you {
        color: #9dffcf;
      }
      #transcript .ai {
        color: #a9b6ff;
      }
      #transcript .label {
        font-weight: 700;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="bubble"></div></div>
    <div id="status">idle</div>
    <button id="toggle">Start talking</button>
    <div id="transcript"></div>

    <script src="app.js"></script>
  </body>
</html>
